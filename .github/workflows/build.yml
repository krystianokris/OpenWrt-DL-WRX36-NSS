name: Build OpenWrt DL-WRX36 NSS

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  OPENWRT_BRANCH: main_nss
  OPENWRT_REPO: https://github.com/AgustinLorenzo/openwrt.git
  TARGET: qualcommax/ipq807x
  PROFILE: dynalink_dl-wrx36

jobs:

  build:
    runs-on: ubuntu-24.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo apt clean


    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
        build-essential \
        clang \
        flex \
        bison \
        g++ \
        gawk \
        gcc-multilib \
        gettext \
        git \
        libncurses-dev \
        libssl-dev \
        python3 \
        rsync \
        unzip \
        zlib1g-dev \
        file


    - name: Clone Agustin NSS
      run: |
        git clone \
        --branch $OPENWRT_BRANCH \
        --depth 1 \
        $OPENWRT_REPO \
        openwrt


    - name: Copy config
      run: |
        cp configs/dl-wrx36.config openwrt/.config


    - name: Update feeds
      working-directory: openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a


    - name: Configure
      working-directory: openwrt
      run: |
        make defconfig


    - name: Download packages
      working-directory: openwrt
      run: |
        make download -j8


    - name: Build firmware
      working-directory: openwrt
      run: |
        make -j$(nproc) V=s


    - name: Prepare artifacts
      run: |
        mkdir -p artifacts

        cp openwrt/bin/targets/qualcommax/ipq807x/*/*sysupgrade* artifacts/ || true
        cp openwrt/bin/targets/qualcommax/ipq807x/*/*factory* artifacts/ || true


    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: DL-WRX36-NSS-firmware
        path: artifacts/
