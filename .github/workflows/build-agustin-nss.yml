name: Build DL-WRX36 NSS Monster

on:
  workflow_dispatch:
#  push:
#    branches:
#      - main

env:
  OPENWRT_REPO: https://github.com/AgustinLorenzo/openwrt.git
  OPENWRT_BRANCH: main_nss

jobs:

  build:

    runs-on: ubuntu-24.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Free disk
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo apt clean


    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gcc-multilib \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          rsync \
          unzip \
          zlib1g-dev \
          file \
          ccache


    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: openwrt-ccache-${{ github.run_id }}
        restore-keys: |
          openwrt-ccache-


    - name: Restore OpenWrt dl cache
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: openwrt-dl-${{ github.run_id }}
        restore-keys: |
          openwrt-dl-


    - name: Clone Agustin NSS
      run: |
        git clone \
          --depth 1 \
          --branch $OPENWRT_BRANCH \
          $OPENWRT_REPO \
          openwrt


    - name: Copy config
      run: |
        cp configs/dl-wrx36.config openwrt/.config


    - name: Apply custom files
      run: |
        if [ -d files ]; then
          echo "Applying custom files overlay..."
          mkdir -p openwrt/files
          cp -a files/. openwrt/files/
        else
          echo "No custom files directory found"
        fi

    - name: Check custom files
      run: |
        echo "Files installed:"
        find openwrt/files -type f | head -50


    - name: Update feeds
      working-directory: openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a


    - name: Defconfig
      working-directory: openwrt
      run: |
        make defconfig
        ./scripts/diffconfig.sh > diffconfig.txt


    - name: Download sources
      working-directory: openwrt
      run: |
        make download -j8


    - name: Build firmware
      working-directory: openwrt
      env:
        CONFIG_CCACHE: 1
      run: |
        export PATH="/usr/lib/ccache:$PATH"
        ccache -M 10G
        make -j$(nproc) V=s


    - name: Prepare artifacts
      run: |
        mkdir -p artifacts

        cp openwrt/bin/targets/qualcommax/ipq807x/*sysupgrade* artifacts/ || true
        cp openwrt/bin/targets/qualcommax/ipq807x/*factory* artifacts/ || true

        echo "BUILD: $GITHUB_RUN_NUMBER" > artifacts/build-info.txt


    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: DL-WRX36-NSS-Monster-${{ github.run_number }}
        path: artifacts/
