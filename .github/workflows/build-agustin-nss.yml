name: Build DL-WRX36 NSS Performance

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_REPO: https://github.com/AgustinLorenzo/openwrt.git
  OPENWRT_BRANCH: main_nss
  TARGET: qualcommax/ipq807x

jobs:

  build:

    runs-on: ubuntu-24.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo apt clean


    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gcc-multilib \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          rsync \
          unzip \
          zlib1g-dev \
          file \
          ccache


    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ runner.os }}-${{ hashFiles('configs/dl-wrx36.config') }}
        restore-keys: |
          ccache-${{ runner.os }}-


    - name: Restore OpenWrt download cache
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: openwrt-dl-${{ hashFiles('configs/dl-wrx36.config') }}
        restore-keys: |
          openwrt-dl-


    - name: Clone Agustin NSS
      run: |
        git clone \
          --depth 1 \
          --branch $OPENWRT_BRANCH \
          $OPENWRT_REPO \
          openwrt


    - name: Create build information
      run: |

        AGUSTIN_REV=$(cd openwrt && git rev-parse --short HEAD)

        mkdir -p files/etc

        cat > files/etc/dl-wrx36-nss-build <<EOF
DL-WRX36 NSS Performance Edition

Build:
$(date -u +"%Y-%m-%d %H:%M UTC")

Firmware:
AgustinLorenzo OpenWrt NSS

Branch:
$OPENWRT_BRANCH

Revision:
$AGUSTIN_REV

Target:
qualcommax/ipq807x Dynalink DL-WRX36

Features:
- Qualcomm NSS acceleration
- ECM acceleration
- ath11k NSS offload
- NSS dashboard
- ECM dashboard
- OpenWrt 2020 theme
- IRQ tuning
EOF


    - name: Copy config
      run: |
        cp configs/dl-wrx36.config openwrt/.config


    - name: Apply custom files
      run: |
        mkdir -p openwrt/files
        cp -a files/. openwrt/files/


    - name: Verify custom files
      run: |
        test -f openwrt/files/usr/libexec/rpcd/luci.nss-dashboard
        test -f openwrt/files/usr/libexec/rpcd/luci.nss-status
        test -f openwrt/files/usr/libexec/rpcd/luci.ecm-status
        echo "Custom files OK"


    - name: Update feeds
      working-directory: openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a


    - name: Defconfig
      working-directory: openwrt
      run: |
        make defconfig
        ./scripts/diffconfig.sh > diffconfig.txt


    - name: Download sources
      working-directory: openwrt
      run: |
        make download -j8


    - name: Build firmware
      working-directory: openwrt
      env:
        CONFIG_CCACHE: 1
      run: |
        export PATH="/usr/lib/ccache:$PATH"
        ccache -M 10G
        make -j$(nproc) V=s


    - name: Prepare artifacts
      run: |
        mkdir -p artifacts

        cp openwrt/bin/targets/${TARGET}/*sysupgrade* artifacts/ || true
        cp openwrt/bin/targets/${TARGET}/*factory* artifacts/ || true

        cp files/etc/dl-wrx36-nss-build artifacts/


    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: DL-WRX36-NSS-${{ github.run_number }}
        path: artifacts/


    - name: Create Release
      uses: softprops/action-gh-release@v2

      if: success()

      with:
        tag_name: dl-wrx36-${{ github.run_number }}
        name: DL-WRX36 NSS Performance Build ${{ github.run_number }}

        body: |
          DL-WRX36 NSS Performance Edition

          Target:
          qualcommax/ipq807x Dynalink DL-WRX36

          Features:
          - NSS acceleration
          - ECM
          - ath11k NSS
          - LuCI dashboard

        files: artifacts/*
        generate_release_notes: true

      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
