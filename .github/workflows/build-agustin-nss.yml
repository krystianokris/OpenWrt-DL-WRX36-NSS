name: Build DL-WRX36 NSS

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_REPO: https://github.com/krystianokris/openwrt.git
  OPENWRT_BRANCH: dl-wrx36-nss
  TARGET: qualcommax/ipq807x

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo apt clean

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gcc-multilib \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          rsync \
          unzip \
          zlib1g-dev \
          file \
          ccache

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: dlwrx36-ccache-${{ hashFiles('configs/dl-wrx36.config') }}
        restore-keys: |
          dlwrx36-ccache-

    - name: Cache OpenWrt dl
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: dlwrx36-dl-${{ hashFiles('configs/dl-wrx36.config') }}
        restore-keys: |
          dlwrx36-dl-

    - name: Clone Agustin NSS
      run: |
        rm -rf openwrt

        git clone \
          --branch ${{ env.OPENWRT_BRANCH }} \
          ${{ env.OPENWRT_REPO }} \
          openwrt

        cd openwrt
        echo "Current commit:"
        git rev-parse HEAD
        git log --oneline -5

    - name: Save pinned commit
      working-directory: openwrt
      run: |
        git rev-parse HEAD > ../pinned-commit.txt

    - name: Clean OpenWrt state
      working-directory: openwrt
      run: |
        rm -rf tmp
        rm -rf feeds
        rm -f .config

    - name: Patch APK feed generation
      working-directory: openwrt
      run: |
        python3 - <<'PY'
        from pathlib import Path

        p = Path("include/feeds.mk")
        s = p.read_text()

        start = s.index("define FeedSourcesAppendAPK")
        end = s.index("endef", start) + len("endef")

        new_block = r'''define FeedSourcesAppendAPK
        ( \
          echo '# This file is auto-generated and build-specific, any changes will be intentionally lost in sysupgrade.'; \
          echo '# Add your custom feeds to /etc/apk/repositories.d/customfeeds.list'; \
          echo 'https://openwrtdata.agustinls.com/nss-wifi-unified/$(shell date +"%Y%m%d")/packages/packages.adb'; \
          echo '%U/packages/%A/base/packages.adb'; \
          $(if $(CONFIG_BUILDBOT), \
                echo '%U/targets/%S/kmods/$(LINUX_VERSION)-$(LINUX_RELEASE)-$(LINUX_VERMAGIC)/packages.adb';) \
          $(foreach feed,$(FEEDS_AVAILABLE), \
                $(if $(CONFIG_FEED_$(feed)), \
                        echo '%U/packages/%A/$(feed)/packages.adb';)) \
        ) >> $(1)
        endef'''

        p.write_text(s[:start] + new_block + s[end:])
        PY

        echo "===== PATCHED FeedSourcesAppendAPK ====="
        sed -n '/define FeedSourcesAppendAPK/,/endef/p' include/feeds.mk


    - name: Update feeds
      working-directory: openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Import NSS config
      working-directory: openwrt
      run: |
        cp ../configs/dl-wrx36.config .config
        make defconfig

    - name: Apply custom files
      run: |
        mkdir -p openwrt/files
        cp -a files/. openwrt/files/

    - name: Remove old Lua LuCI files
      run: |
        rm -rf openwrt/files/usr/lib/lua/luci/controller/dlwrx36.lua || true
        rm -rf openwrt/files/usr/lib/lua/luci/view/dlwrx36 || true

    - name: Configure OpenWrt
      working-directory: openwrt
      run: |
        ./scripts/diffconfig.sh > ../diffconfig.txt

    - name: Verify LuCI files
      run: |
        echo "Checking DL-WRX36 dashboard"
        test -f files/www/luci-static/resources/view/dlwrx36/nss.js
        test -f files/usr/libexec/rpcd/luci.nss-dashboard
        echo "OK"

    - name: Download sources
      working-directory: openwrt
      run: |
        make download V=s

    - name: Build tools
      working-directory: openwrt
      run: |
        make tools/install -j$(nproc) V=s || \
        make tools/install V=s

    - name: Build toolchain
      working-directory: openwrt
      run: |
        make toolchain/install -j$(nproc) V=s || \
        make toolchain/install V=s

    - name: Build firmware
      working-directory: openwrt
      env:
        CONFIG_CCACHE: 1
      run: |
        export PATH="/usr/lib/ccache:$PATH"
        ccache -M 10G
        make -j$(nproc) V=s || \
        make V=s

    - name: Show rejected patch hunks on failure
      if: failure()
      run: |
        find openwrt -name "*.rej" -print -exec cat {} \;

    - name: Prepare artifacts
      run: |
        mkdir -p artifacts
        cp openwrt/bin/targets/${{ env.TARGET }}/*sysupgrade* artifacts/ || true
        cp openwrt/bin/targets/${{ env.TARGET }}/*factory* artifacts/ || true
        cp diffconfig.txt artifacts/ || true
        cp files/etc/dl-wrx36-nss-build artifacts/ || true
        cp pinned-commit.txt artifacts/ || true

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DL-WRX36-NSS-${{ github.run_number }}
        path: artifacts/

    - name: Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: dl-wrx36-${{ github.run_number }}
        name: DL-WRX36 NSS Build ${{ github.run_number }}
        body: |
          DL-WRX36 NSS Build

          Features:
          - Qualcomm NSS acceleration
          - ECM acceleration
          - ath11k NSS offload
          - NSS qdisc
          - ECM dashboard
          - NSS dashboard
          - Native LuCI JS interface

          Source: AgustinLorenzo/openwrt (branch: main_nss)
        files: artifacts/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
