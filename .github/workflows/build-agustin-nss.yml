name: Build Agustin NSS DL-WRX36

on:
  workflow_dispatch:
  #push:
    #branches:
      #- main

env:
  OPENWRT_REPO: https://github.com/AgustinLorenzo/openwrt.git
  OPENWRT_BRANCH: main_nss

jobs:

  build:

    runs-on: ubuntu-24.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Free disk
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo apt clean


    - name: Install packages
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          rsync \
          unzip \
          zlib1g-dev \
          file \
          ccache


    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ github.sha }}
        restore-keys: |
          ccache-


    - name: Clone Agustin NSS
      run: |
        git clone \
          --branch $OPENWRT_BRANCH \
          --depth 1 \
          $OPENWRT_REPO \
          openwrt


    - name: Copy config
      run: |
        cp configs/dl-wrx36.config openwrt/.config


    - name: Configure
      working-directory: openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        make defconfig


    - name: Restore downloads cache
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: openwrt-dl-${{ hashFiles('configs/dl-wrx36.config') }}
        restore-keys: |
          openwrt-dl-


    - name: Download
      working-directory: openwrt
      run: |
        make download -j8


    - name: Build firmware
      working-directory: openwrt
      run: |
        export PATH="/usr/lib/ccache:$PATH"
        export CCACHE_DIR=$HOME/.ccache
        ccache -M 5G
        make -j$(nproc) V=s


    - name: Locate firmware
      run: |
        mkdir -p artifacts

        echo "Searching firmware..."

        find openwrt/bin/targets -type f \
          \( -name "*sysupgrade*" -o -name "*factory*" \)

        cp openwrt/bin/targets/qualcommax/ipq807x/*sysupgrade* artifacts/ || true
        cp openwrt/bin/targets/qualcommax/ipq807x/*factory* artifacts/ || true

        ls -lah artifacts


    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: DL-WRX36-Agustin-NSS
        path: artifacts/


 
