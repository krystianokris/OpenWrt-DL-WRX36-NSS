name: 🚀 DL-WRX36 NSS - Manual Build

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: '🔥 Force clean build (disable all cache)'
        type: boolean
        default: false
      debug_mode:
        description: '🐛 Enable debug logging'
        type: boolean
        default: false
      variant:
        description: '📦 Build variant'
        type: choice
        options:
          - standard
          - minimal
          - both
        default: standard

permissions:
  contents: write
  actions: read

env:
  OPENWRT_REPO: https://github.com/krystianokris/openwrt.git
  OPENWRT_BRANCH: dl-wrx36-nss
  TARGET: qualcommax/ipq807x
  CCACHE_MAX_SIZE: 10G
  CACHE_VERSION: v3

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event.inputs.variant == 'both' && '["standard", "minimal"]' || github.event.inputs.variant == 'minimal' && '["minimal"]' || '["standard"]') }}
    
    steps:

    - name: 📦 Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: 💾 Free disk space
      if: github.event.inputs.clean_build == 'true'
      run: |
        echo "===== FREEING DISK SPACE ====="
        df -h
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo docker system prune -af 2>/dev/null || true
        sudo apt clean
        echo "===== DISK AFTER ====="
        df -h

    - name: 📦 Install dependencies
      run: |
        echo "===== INSTALLING DEPENDENCIES ====="
        sudo apt update -qq
        sudo apt install -y -qq \
          build-essential clang flex bison g++ gawk gcc-multilib \
          gettext git libncurses-dev libssl-dev python3 python3-pip \
          rsync unzip zlib1g-dev file ccache time tree jq bc wget
        echo "✅ Dependencies installed"

    - name: ⚡ Setup ccache
      run: |
        echo "===== CCACHE SETUP ====="
        mkdir -p ~/.ccache
        ccache -M ${{ env.CCACHE_MAX_SIZE }}
        echo "/usr/lib/ccache" >> $GITHUB_PATH

    - name: 🚀 Clone OpenWrt
      run: |
        echo "===== CLONING OPENWRT ====="
        rm -rf openwrt
        git clone --single-branch --branch ${{ env.OPENWRT_BRANCH }} --depth 1 ${{ env.OPENWRT_REPO }} openwrt
        cd openwrt
        echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
        echo "OPENWRT_DATE=$(git log -1 --format=%ci)" >> $GITHUB_ENV
        echo "✅ Cloned successfully"
        echo "Commit: $(git rev-parse --short HEAD)"

    - name: 💾 Cache ccache
      uses: actions/cache@v4
      id: ccache-cache
      with:
        path: ~/.ccache
        key: dlwrx36-${{ env.CACHE_VERSION }}-ccache-${{ hashFiles('configs/dl-wrx36.config') }}
        restore-keys: |
          dlwrx36-${{ env.CACHE_VERSION }}-ccache-
          dlwrx36-ccache-

    - name: 💾 Cache downloads
      uses: actions/cache@v4
      id: dl-cache
      with:
        path: openwrt/dl
        key: dlwrx36-${{ env.CACHE_VERSION }}-dl-${{ hashFiles('configs/dl-wrx36.config') }}
        restore-keys: |
          dlwrx36-${{ env.CACHE_VERSION }}-dl-
          dlwrx36-dl-

    - name: 🧹 Clean build (if requested)
      if: github.event.inputs.clean_build == 'true'
      working-directory: openwrt
      run: |
        echo "===== CLEAN BUILD ====="
        rm -rf staging_dir tmp .config logs
        echo "✅ Cleaned"

    - name: 🧹 Standard cleanup
      working-directory: openwrt
      run: |
        echo "===== STANDARD CLEANUP ====="
        rm -rf tmp .config .config.old
        echo "✅ Cleaned (staging_dir preserved)"

    - name: 📝 Patch APK feed (if needed)
      working-directory: openwrt
      run: |
        echo "===== CHECKING APK ====="
        
        if grep -q "CONFIG_USE_APK=y" ../configs/dl-wrx36.config 2>/dev/null; then
          echo "📦 APK detected - patching feeds"
          if [ -f ../scripts/patch_apk.py ]; then
            python3 ../scripts/patch_apk.py
          else
            echo "⚠️ patch_apk.py not found, skipping"
          fi
        else
          echo "📦 OPKG detected - no patch needed"
        fi

    - name: 📡 Update feeds
      working-directory: openwrt
      run: |
        echo "===== UPDATING FEEDS ====="
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        echo "✅ Feeds updated"

    - name: ⚙️ Configure OpenWrt
      working-directory: openwrt
      run: |
        echo "===== CONFIGURING ====="
        cp ../configs/dl-wrx36.config .config
        make defconfig
        echo "✅ Configured"

    - name: 🔧 Fix WiFi configuration
      working-directory: openwrt
      run: |
        echo "===== FIXING WIFI CONFIG ====="
        
        # Sprawdź jakie opcje wpad są dostępne
        echo "Available wpad options:"
        grep -E '^CONFIG_PACKAGE_wpad' .config || echo "No wpad config found"
        
        # Usuń wszystkie wpad
        sed -i '/^CONFIG_PACKAGE_wpad/d' .config
        
        # Dodaj tylko to co jest potrzebne - sprawdź czy wpad-openssl istnieje
        if grep -q "CONFIG_PACKAGE_wpad-openssl" ../configs/dl-wrx36.config; then
          echo 'CONFIG_PACKAGE_wpad-openssl=y' >> .config
        elif grep -q "CONFIG_PACKAGE_wpad-basic-openssl" ../configs/dl-wrx36.config; then
          echo 'CONFIG_PACKAGE_wpad-basic-openssl=y' >> .config
        else
          # Jeśli żaden nie istnieje, spróbujmy hostapd i wpad minimal
          echo 'CONFIG_PACKAGE_wpad-basic-openssl=y' >> .config
          echo 'CONFIG_PACKAGE_hostapd-openssl=y' >> .config
        fi
        
        # Wyłącz mesh
        echo '# CONFIG_PACKAGE_wpad-mesh-openssl is not set' >> .config
        echo '# CONFIG_PACKAGE_wpad-mesh-wolfssl is not set' >> .config
        
        make defconfig
        
        echo "===== FINAL WPAD CONFIG ====="
        grep -E '^CONFIG_PACKAGE_wpad' .config || echo "No wpad config"
        grep -E '^CONFIG_PACKAGE_hostapd' .config || echo "No hostapd config"

    - name: 🦇 Disable BATMAN
      working-directory: openwrt
      run: |
        echo "===== DISABLING BATMAN ====="
        sed -i '/^CONFIG_PACKAGE_.*batman/d' .config
        sed -i '/^CONFIG_PACKAGE_.*batctl/d' .config
        sed -i '/^CONFIG_PACKAGE_luci-proto-batman/d' .config
        echo '# CONFIG_PACKAGE_kmod-batman-adv is not set' >> .config
        echo '# CONFIG_PACKAGE_batctl-full is not set' >> .config
        echo '# CONFIG_PACKAGE_batctl-tiny is not set' >> .config
        echo '# CONFIG_PACKAGE_luci-proto-batman-adv is not set' >> .config
        make defconfig
        if grep -E "^CONFIG_PACKAGE_.*batman" .config | grep -v "is not set" | grep -v "=n" > /dev/null; then
          echo "❌ BATMAN still enabled!"
          grep -E "^CONFIG_PACKAGE_.*batman" .config | grep -v "is not set" | grep -v "=n"
          exit 1
        fi
        echo "✅ BATMAN disabled"

    - name: ✅ Verify configuration
      working-directory: openwrt
      run: |
        echo "===== VERIFYING CONFIG ====="
        
        # Sprawdź NSS
        for pkg in sqm-scripts-nss kmod-qca-nss-drv-qdisc kmod-qca-nss-drv-igs; do
          if grep -q "^CONFIG_PACKAGE_${pkg}=y" .config; then
            echo "  ✅ ${pkg}"
          else
            echo "  ❌ ${pkg} - MISSING"
            exit 1
          fi
        done
        
        # Sprawdź WiFi - akceptujemy różne warianty
        if grep -q "^CONFIG_PACKAGE_wpad.*openssl" .config; then
          echo "  ✅ wpad with openssl"
        elif grep -q "^CONFIG_PACKAGE_hostapd.*openssl" .config; then
          echo "  ✅ hostapd with openssl"
        else
          echo "  ❌ No wpad/hostapd with openssl found"
          exit 1
        fi
        
        # Sprawdź czy nie ma mesh
        if grep -q "^CONFIG_PACKAGE_wpad-mesh" .config; then
          echo "  ❌ wpad-mesh - ENABLED"
          exit 1
        fi
        
        echo "✅ All checks passed"

    - name: 📁 Apply custom files
      run: |
        echo "===== APPLYING CUSTOM FILES ====="
        mkdir -p openwrt/files
        if [ -d "files" ] && [ "$(ls -A files 2>/dev/null)" ]; then
          rsync -a --delete files/ openwrt/files/
          echo "✅ Custom files copied"
        fi
        echo "===== CLEANING BATMAN ====="
        find openwrt/files -type f \( -iname '*batman*' -o -iname '*batctl*' \) -delete 2>/dev/null || true
        rm -rf openwrt/files/usr/lib/lua/luci/controller/mesh 2>/dev/null || true
        rm -rf openwrt/files/usr/lib/lua/luci/view/mesh 2>/dev/null || true
        find openwrt/files -type d -empty -delete 2>/dev/null || true
        if find openwrt/files -type f -iname '*batman*' | grep -q .; then
          echo "❌ BATMAN files still exist!"
          find openwrt/files -type f -iname '*batman*'
          exit 1
        fi
        echo "✅ Cleanup complete"

    - name: 🎨 Generate banner
      working-directory: openwrt
      run: |
        SHORT_COMMIT="$(git rev-parse --short HEAD)"
        BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        mkdir -p files/etc
        cat > files/etc/banner <<EOF
        
        ██████╗ ██╗    - WRX36
        ██╔══██╗██║
        ██║  ██║██║
        ██║  ██║██║
        ██████╔╝███████╗
        ╚═════╝ ╚══════╝

        Dynalink DL-WRX36
        ================================

        NSS / ECM        : ENABLED
        NSS Qdisc        : ENABLED
        SQM NSS          : ENABLED
        NSS IGS          : ENABLED

        WiFi             : WPA/OPENSSL
        Mesh             : DISABLED
        BATMAN           : DISABLED

        Build            : ${{ github.run_number }}
        Date             : ${BUILD_DATE}
        Commit           : ${SHORT_COMMIT}
        Variant          : ${{ matrix.variant }}

        ================================

        EOF
        echo "✅ Banner generated"

    - name: 📥 Download sources
      working-directory: openwrt
      run: |
        echo "===== DOWNLOADING SOURCES ====="
        make download -j$(nproc) V=s
        echo "✅ Sources downloaded"

    - name: 🔨 Build firmware
      working-directory: openwrt
      env:
        CONFIG_CCACHE: 1
      run: |
        echo "===== BUILDING FIRMWARE ====="
        export CCACHE_DIR="$HOME/.ccache"
        echo "Building variant: ${{ matrix.variant }}"
        echo "Using $(nproc) jobs"
        make tools/install -j$(nproc) V=s
        make toolchain/install -j$(nproc) V=s
        make -j$(nproc) V=s
        echo "✅ Build complete"

    - name: 📦 Collect artifacts
      if: always()
      run: |
        echo "===== COLLECTING ARTIFACTS ====="
        mkdir -p artifacts-${{ matrix.variant }}
        if [ -d "openwrt/bin/targets/${{ env.TARGET }}" ]; then
          find openwrt/bin/targets/${{ env.TARGET }} \
            -maxdepth 2 -type f \
            \( -name '*sysupgrade*' -o -name '*factory*' -o -name '*.manifest' -o -name '*.itb' -o -name '*.bin' \) \
            -exec cp -v {} artifacts-${{ matrix.variant }}/ \; 2>/dev/null || true
          echo "✅ Artifacts collected"
        else
          echo "⚠️ No build output found"
        fi

    - name: 🔐 Generate checksums
      if: always()
      run: |
        echo "===== GENERATING CHECKSUMS ====="
        if [ -d "artifacts-${{ matrix.variant }}" ] && [ "$(ls -A artifacts-${{ matrix.variant }})" ]; then
          cd artifacts-${{ matrix.variant }}
          find . -type f -exec sha256sum {} \; > sha256sums.txt
          find . -type f -exec md5sum {} \; > md5sums.txt
          cat sha256sums.txt
          echo "✅ Checksums generated"
        else
          echo "⚠️ No artifacts to checksum"
        fi

    - name: 🔒 Verify manifest
      if: always()
      run: |
        echo "===== VERIFYING MANIFEST ====="
        MANIFEST=$(find artifacts-${{ matrix.variant }} -name "*.manifest" 2>/dev/null | head -n1)
        if [ -f "$MANIFEST" ]; then
          if grep -E -i 'batman|batctl|wpad-mesh' "$MANIFEST"; then
            echo "❌ CRITICAL: BATMAN/MESH packages found!"
            exit 1
          fi
          echo "✅ Manifest clean - no forbidden packages"
        else
          echo "⚠️ No manifest found"
        fi

    - name: 📤 Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: DL-WRX36-${{ matrix.variant }}-${{ github.run_number }}
        path: artifacts-${{ matrix.variant }}/
        retention-days: 30

    - name: 📅 Set release meta
      if: success() && matrix.variant == 'standard'
      id: meta
      run: |
        echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    - name: 🚀 Create release
      if: success() && matrix.variant == 'standard'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: dl-wrx36-${{ steps.meta.outputs.date }}-${{ github.run_number }}
        name: DL-WRX36 NSS ${{ steps.meta.outputs.date }} (build ${{ github.run_number }})
        prerelease: true
        draft: false
        body: |
          # DL-WRX36 NSS ${{ steps.meta.outputs.date }}

          **Build run:** ${{ github.run_number }}

          ## Features
          - Qualcomm NSS acceleration
          - ECM acceleration
          - ath11k NSS offload
          - NSS qdisc
          - SQM NSS scripts
          - NSS IGS
          - Custom LuCI dashboard
          - LuCI OpenWrt 2020 theme
          - Standard WPA/OpenSSL WiFi

          ## Disabled
          - Mesh WiFi
          - BATMAN

          ## Build details
          - **Source:** ${{ env.OPENWRT_REPO }}
          - **Branch:** ${{ env.OPENWRT_BRANCH }}
          - **Commit:** `${{ env.OPENWRT_COMMIT }}`
          - **OpenWrt commit date:** ${{ env.OPENWRT_DATE }}
          - **Release date:** ${{ steps.meta.outputs.date }}
          - **Variant:** ${{ matrix.variant }}

          ## Files
          - `sysupgrade.bin` - Firmware upgrade
          - `factory.bin` - Initial flash
          - `*.manifest` - Package list
          - `sha256sums.txt` - SHA256 checksums

          ---
          Built by GitHub Actions
        files: artifacts-standard/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 📋 Show errors on failure
      if: failure()
      run: |
        echo "===== BUILD FAILED ====="
        echo "Build ${{ github.run_number }} failed"
        echo "Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        find openwrt -name "*.rej" -exec echo "Rejected patch: {}" \; -exec cat {} \; 2>/dev/null || true
